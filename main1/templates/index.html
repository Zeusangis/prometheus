<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --muted-2: #94a3b8;
      --blue: #60a5fa;
      --green: #1fb981;
      --green-dark: #15a26f;
      --red: #b74b46;
      --red-dark: #a13f3b;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      --transcript-width: 360px;
      --topbar-height: 94px;
      --controls-height: 132px;
      --shell-border: #747cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      padding: 8px;
    }

    .app-shell {
      width: 100%;
      height: calc(100vh - 16px);
      background: var(--panel);
      border-radius: 22px;
      border: 3px solid var(--shell-border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      height: var(--topbar-height);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.92), rgba(250,250,250,0.98));
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .brand-area {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-width: 0;
    }

    .brand-compan {
      font-size: 18px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .center-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      transform: translateY(1px);
    }

    .time-info {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #6b7280;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d1d5db;
      display: inline-block;
      transition: background 0.2s ease;
    }

    .live-dot.active {
      background: #c6c9cf;
    }

    .separator {
      color: #d1d5db;
    }

    .interviewer-line {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.15;
      color: #475569;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .interviewer-line .interviewer-nam {
      color: #2563eb;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .icon-btn-small {
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      border-radius: 12px;
      color: #4b5563;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .icon-btn-small:hover {
      background: #f3f4f6;
      transform: translateY(-1px);
    }

    .content-area {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow: hidden;
    }

    .video-stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    .video-container {
      width: 100%;
      max-width: 1220px;
      aspect-ratio: 1 / 1.01;
      height: min(
        calc(100vh - var(--topbar-height) - var(--controls-height) - 58px),
        calc((100vw - var(--transcript-width) - 58px) * 1.01)
      );
      min-height: 320px;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      background: #e8edf0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    #avatarImage,
    #remoteVideo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      background: #e8edf0;
    }

    #remoteVideo {
      display: none;
    }

    .status-pill {
      position: absolute;
      left: 18px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 999px;
      padding: 12px 16px;
      color: #4b5563;
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      z-index: 2;
    }

    .status-pill .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
    }

    .controls-bar {
      height: var(--controls-height);
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
    }

    .controls-panel {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(248, 250, 251, 0.9);
      padding: 14px;
      border-radius: 22px;
      border: 1px solid #eef1f4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      backdrop-filter: blur(10px);
    }

    .control-btn {
      width: 106px;
      height: 90px;
      border-radius: 18px;
      border: none;
      background: #e7ebf1;
      color: #374151;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      font-weight: 800;
    }

    .control-btn:hover {
      transform: translateY(-1px);
      background: #dde4ec;
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }

    .control-btn i {
      font-size: 24px;
      line-height: 1;
    }

    .control-btn span {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .control-btn.muted {
      background: #f1d8d8;
      color: #8a3b37;
    }

    .meeting-btn {
      width: 136px;
      color: white;
      background: var(--green);
    }

    .meeting-btn:hover {
      background: var(--green-dark);
    }

    .meeting-btn.end {
      background: var(--red);
    }

    .meeting-btn.end:hover {
      background: var(--red-dark);
    }

    .transcript-panel {
      width: var(--transcript-width);
      min-width: var(--transcript-width);
      max-width: var(--transcript-width);
      border-left: 1px solid var(--border);
      background: var(--panel-soft);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, min-width 0.25s ease, max-width 0.25s ease;
    }

    .transcript-panel.minimized {
      width: 68px;
      min-width: 68px;
      max-width: 68px;
    }

    .transcript-header {
      height: 92px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .transcript-title-wrap {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .transcript-title-wrap i {
      font-size: 22px;
      color: #4b5563;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .transcript-title-text h2 {
      font-size: 15px;
      font-weight: 800;
      color: #1f2937;
      line-height: 1.2;
    }

    .transcript-title-text p {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
      font-weight: 600;
    }

    .transcript-toggle {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: none;
      background: #f3f4f6;
      color: #374151;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }

    .transcript-toggle:hover {
      background: #e5e7eb;
    }

    .transcript-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .transcript-panel.minimized .transcript-title-text,
    .transcript-panel.minimized .transcript-body {
      display: none;
    }

    .transcript-panel.minimized .transcript-header {
      height: 100%;
      border-bottom: none;
      padding: 12px;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      gap: 14px;
    }

    .transcript-panel.minimized .transcript-title-wrap {
      width: 100%;
      justify-content: center;
    }

    .transcript-panel.minimized .transcript-toggle {
      margin: 0 auto;
    }

    .transcript-message {
      background: white;
      border: 1px solid #e7ebf0;
      border-radius: 16px;
      padding: 13px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .transcript-message.ai {
      border-left: 5px solid #60a5fa;
    }

    .transcript-message.user {
      border-left: 5px solid #10b981;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .msg-role {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #374151;
    }

    .msg-time {
      font-size: 12px;
      color: #9ca3af;
      white-space: nowrap;
      font-weight: 700;
    }

    .msg-text {
      font-size: 14px;
      line-height: 1.55;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .transcript-empty {
      margin-top: 8px;
      padding: 18px;
      border: 1px dashed #d1d5db;
      border-radius: 14px;
      color: #6b7280;
      font-size: 14px;
      background: rgba(255,255,255,0.6);
      font-weight: 600;
    }

    @media (max-width: 1400px) {
      .video-container {
        height: min(
          calc(100vh - var(--topbar-height) - var(--controls-height) - 56px),
          calc((100vw - var(--transcript-width) - 56px) * 1.01)
        );
      }
    }

    @media (max-width: 1100px) {
      .transcript-panel {
        width: 300px;
        min-width: 300px;
        max-width: 300px;
      }

      .video-container {
        max-width: none;
        height: min(
          calc(100vh - var(--topbar-height) - var(--controls-height) - 50px),
          calc((100vw - 300px - 50px) * 1.01)
        );
      }
    }

    @media (max-width: 860px) {
      :root {
        --topbar-height: 102px;
      }

      .top-bar {
        grid-template-columns: 1fr;
        gap: 10px;
        justify-items: center;
        padding: 10px 14px;
        height: var(--topbar-height);
      }

      .brand-area,
      .actions {
        width: 100%;
      }

      .brand-area {
        justify-content: flex-start;
      }

      .actions {
        display: none;
      }

      .content-area {
        flex-direction: column;
      }

      .main-column {
        padding: 14px;
      }

      .video-stage-wrap {
        align-items: center;
      }

      .video-container {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1.01;
        min-height: 280px;
      }

      .transcript-panel {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: 260px;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      .transcript-panel.minimized {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: 64px;
      }

      .controls-bar {
        height: auto;
        padding-bottom: 14px;
      }

      .control-btn {
        width: 96px;
        height: 84px;
      }

      .meeting-btn {
        width: 126px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-area">
        <div class="brand-compan" id="companyLabe">Prometheus</div>
      </div>

      <div class="center-meta">
        <div class="time-info">
          <span class="live-dot" id="liveDot"></span>
          <span id="callBadge">00:00</span>
          <span class="separator">|</span>
          <span id="clockTime">03:06 AM</span>
        </div>
        <div class="interviewer-line">
          with <span class="interviewer-nam" id="roleLabe">Lauren</span>
        </div>
      </div>

      <div class="actions">
        <button class="icon-btn-small" id="fullscreenBtn" title="Fullscreen" type="button">
          <i class="ph ph-corners-out"></i>
        </button>
      </div>
    </header>

    <div class="content-area">
      <div class="main-column">
        <div class="video-stage-wrap">
          <div class="video-container">
            <img
              id="avatarImage"
              src="https://api.navtalk.ai/uploadFiles/navtalk.Lauren.png"
              alt="AI Interviewer"
            />
            <video id="remoteVideo" autoplay playsinline></video>

            <div class="status-pill">
              <span class="dot" id="statusDot"></span>
              <span id="statusLabel">Ready to start meeting</span>
            </div>
          </div>
        </div>

        <footer class="controls-bar">
          <div class="controls-panel">
            <button class="control-btn" id="micBtn" type="button">
              <i class="ph-fill ph-microphone" id="micIcon"></i>
              <span id="micText">MIC ON</span>
            </button>

            <button class="control-btn meeting-btn start" id="meetingBtn" type="button">
              <i class="ph-fill ph-phone-call" id="meetingIcon"></i>
              <span id="meetingText">START</span>
            </button>
          </div>
        </footer>
      </div>

      <aside class="transcript-panel" id="transcriptPanel">
        <div class="transcript-header">
          <div class="transcript-title-wrap">
            <i class="ph-fill ph-text-align-left"></i>
            <div class="transcript-title-text">
              <h2>Transcript</h2>
              <p>Live conversation</p>
            </div>
          </div>

          <button class="transcript-toggle" id="transcriptToggle" title="Minimize transcript" type="button">
            <i class="ph ph-sidebar-simple"></i>
          </button>
        </div>

        <div class="transcript-body" id="transcriptBox">
          <div class="transcript-empty">
            Transcript messages will appear here.
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
